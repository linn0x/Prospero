[package]
name = "prospero-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22.1"
futures-util = "0.3.32"
prospero-protocol-rs = { path = "../prospero-protocol" }
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls-webpki-roots", "stream", "json", "http2"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
thiserror = "2.0"
url = "2.5.8"
uuid = { version = "1.20.0", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
axum = { version = "0.8.8", features = ["json", "tokio", "http1"] }
tempfile = "3.24.0"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
