name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-daemon:
    name: Rust Daemon (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: linux-x64
          - os: windows-latest
            artifact: windows-x64
          - os: windows-11-arm
            artifact: windows-arm64
          - os: macos-15-intel
            artifact: mac-x64
          - os: macos-14
            artifact: mac-arm64
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          architecture: ${{ endsWith(matrix.artifact, 'arm64') && 'arm64' || 'x64' }}
      - name: Check Rust workspace
        run: cargo fmt --all --check && cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Rust workspace
        if: runner.os != 'Windows'
        run: cargo test --workspace --locked
      - name: Test Windows workspace within runner Job
        if: runner.os == 'Windows'
        run: cargo test --workspace --locked -- --skip conpty_shell_survives_daemon_restarts_and_explicit_close_archives_it
      - name: Accept Linux native daemon and PTY
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: cargo build --release --workspace --locked && node tools/perf/rust-daemon-acceptance.mjs --release --seconds 20 --sessions 8 --output target/prospero-acceptance/linux-native.json
      - name: Accept Windows native daemon and ConPTY
        if: runner.os == 'Windows'
        timeout-minutes: 8
        shell: pwsh
        run: |
          cargo build --release --workspace --locked
          if ($LASTEXITCODE -ne 0) { throw 'Rust release build failed' }
          $artifacts = & cargo test -p prosperod-rs --test terminal_host_lifecycle --no-run --locked --message-format=json
          if ($LASTEXITCODE -ne 0) { throw 'Rust lifecycle test build failed' }
          $executable = @($artifacts | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'terminal_host_lifecycle' -and $_.executable } | ForEach-Object { $_.executable }) | Select-Object -Last 1
          if (-not $executable) { throw 'Missing Rust lifecycle test executable' }
          & ./tools/ci/verify-rust-windows-host.ps1 -Workspace $env:GITHUB_WORKSPACE -TestExecutable $executable -NodePath (Get-Command node.exe).Source

  node:
    name: Node checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -w @prospero/mobile
      - run: npm test

  macos-desktop:
    name: macOS Electron desktop
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck -w @prospero/desktop
      - run: npm run build -w @prospero/desktop
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Build bundled Rust daemon and CLI
        run: cargo build --release -p prosperod-rs --bins --locked
      - name: Stage the bundled daemon runtime
        run: node apps/desktop/scripts/prepare-runtime.mjs

  windows-desktop:
    name: Windows Electron desktop
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck -w @prospero/desktop
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Build bundled Rust daemon and CLI
        run: cargo build --release -p prosperod-rs --bins --locked
      - name: Build the sandboxed Electron workbench and self-contained x64 package
        run: ./apps/desktop/scripts/package.ps1 -Architecture x64
      - name: Start packaged UI and its bundled daemon
        run: |
          $smokeHome = Join-Path $env:RUNNER_TEMP 'prospero-windows-electron-smoke'
          New-Item -ItemType Directory -Path $smokeHome -Force | Out-Null
          try {
            $env:PROSPERO_HOME = $smokeHome
            $process = Start-Process -FilePath ./dist/desktop/win-unpacked/Prospero.exe -ArgumentList '--smoke-test' -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              Get-Content -LiteralPath (Join-Path $smokeHome 'desktop.log') -ErrorAction SilentlyContinue
              throw "Windows Electron smoke test failed with exit code $($process.ExitCode)"
            }
          } finally {
            Remove-Item Env:\PROSPERO_HOME -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: prospero-windows-x64-ci
          path: |
            dist/desktop/Prospero-*-windows-x64.exe
            dist/desktop/Prospero-*-windows-x64.zip
          if-no-files-found: error

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check -
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
      - name: Scan Git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --config .gitleaks.toml --log-opts="--all"'
