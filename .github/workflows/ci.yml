name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -w @prospero/mobile
      - run: npm test

  windows-native:
    name: Windows native (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          # This is intentionally an unconditional real hosted ARM64 job: a
          # queue/image/build failure is a CI failure, never a skipped pass.
          - arch: arm64
            runner: windows-11-arm
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Assert the runner matches the artifact architecture
        run: |
          node -e "if (process.platform !== 'win32' || process.arch !== '${{ matrix.arch }}') { throw new Error('expected win32/${{ matrix.arch }}, received ' + process.platform + '/' + process.arch) }"
      - name: Build and exercise the real Node-API addon
        run: |
          npm run build --workspace=@prospero/windows-native
          npm run test:native --workspace=@prospero/windows-native
      - name: Stage an unsigned CI-only artifact and prove production rejects it
        run: |
          node packages/windows-native/scripts/stage-prebuild.mjs --source packages/windows-native/build/Release/prospero_windows_native.node --destination packages/windows-native --arch ${{ matrix.arch }} --authenticode-status unsigned
          node packages/windows-native/scripts/smoke-loader.mjs --package-root packages/windows-native --expect unsigned
          npm run verify:prebuilds --workspace=@prospero/windows-native
      - name: Exercise full-process Session Host acceptance with an ephemeral trusted test signature
        # The production loader deliberately rejects source-built/unsigned
        # addons. Trust a runner-local self-signed copy only for this step,
        # then restore the original unsigned artifact before upload/release.
        timeout-minutes: 10
        run: |
          $artifact = 'packages/windows-native/prebuilds/win32-${{ matrix.arch }}/prospero_windows_native.node'
          $source = 'packages/windows-native/build/Release/prospero_windows_native.node'
          Write-Host 'Creating ephemeral code-signing certificate'
          $certificate = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Prospero Windows CI Session Host Test' -CertStoreLocation 'Cert:\CurrentUser\My'
          $signTool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\${{ matrix.arch }}\signtool.exe" -File -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signTool) { throw 'signtool.exe was not found in the Windows SDK' }
          function Set-EphemeralCertificateTrust {
            param(
              [System.Security.Cryptography.X509Certificates.X509Certificate2] $Certificate,
              [string] $StoreName,
              [bool] $Trusted
            )
            $store = [System.Security.Cryptography.X509Certificates.X509Store]::new(
              $StoreName,
              [System.Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser
            )
            try {
              $store.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
              if ($Trusted) { $store.Add($Certificate) } else { $store.Remove($Certificate) }
            } finally {
              $store.Close()
            }
          }
          try {
            Write-Host 'Trusting ephemeral certificate without certificate-import UI'
            Set-EphemeralCertificateTrust -Certificate $certificate -StoreName 'Root' -Trusted $true
            Set-EphemeralCertificateTrust -Certificate $certificate -StoreName 'TrustedPublisher' -Trusted $true
            Copy-Item -LiteralPath $source -Destination $artifact -Force
            Write-Host "Signing $artifact with $signTool"
            & $signTool sign /fd SHA256 /sha1 $certificate.Thumbprint $artifact
            if ($LASTEXITCODE -ne 0) { throw 'signtool failed for the ephemeral Session Host test artifact' }
            $signature = Get-AuthenticodeSignature -LiteralPath $artifact
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $certificate.Thumbprint) {
              throw 'ephemeral Session Host test artifact is not trusted by the Windows loader'
            }
            Write-Host 'Ephemeral Authenticode signature is trusted; running Session Host acceptance'
            node packages/windows-native/scripts/stage-prebuild.mjs --source $artifact --destination packages/windows-native --arch ${{ matrix.arch }} --authenticode-status valid --thumbprint $certificate.Thumbprint
            $env:PROSPERO_WINDOWS_SIGNED_SESSION_HOST_TEST = '1'
            npm run build --workspace=@prospero/daemon
            npm run test:windows-native --workspace=@prospero/daemon
          } finally {
            Copy-Item -LiteralPath $source -Destination $artifact -Force
            node packages/windows-native/scripts/stage-prebuild.mjs --source $artifact --destination packages/windows-native --arch ${{ matrix.arch }} --authenticode-status unsigned
            Set-EphemeralCertificateTrust -Certificate $certificate -StoreName 'Root' -Trusted $false
            Set-EphemeralCertificateTrust -Certificate $certificate -StoreName 'TrustedPublisher' -Trusted $false
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -Force -ErrorAction SilentlyContinue
          }
      - name: Upload unsigned test artifact and SHA-256 manifest
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-unsigned-${{ matrix.arch }}
          path: packages/windows-native/prebuilds/win32-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7

  release-stage:
    name: Sign and package Windows native release artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-native
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build --workspace=@prospero/windows-native
      - uses: actions/download-artifact@v5
        with:
          name: windows-native-unsigned-x64
          path: packages/windows-native/prebuilds/win32-x64
      - uses: actions/download-artifact@v5
        with:
          name: windows-native-unsigned-arm64
          path: packages/windows-native/prebuilds/win32-arm64
      - name: Require signing configuration and Authenticode-sign both architectures
        env:
          WINDOWS_AUTHENTICODE_PFX_BASE64: ${{ secrets.WINDOWS_AUTHENTICODE_PFX_BASE64 }}
          WINDOWS_AUTHENTICODE_PFX_PASSWORD: ${{ secrets.WINDOWS_AUTHENTICODE_PFX_PASSWORD }}
          WINDOWS_AUTHENTICODE_THUMBPRINT_SHA1: ${{ secrets.WINDOWS_AUTHENTICODE_THUMBPRINT_SHA1 }}
          WINDOWS_AUTHENTICODE_TIMESTAMP_URL: ${{ vars.WINDOWS_AUTHENTICODE_TIMESTAMP_URL }}
        run: |
          $required = @(
            'WINDOWS_AUTHENTICODE_PFX_BASE64',
            'WINDOWS_AUTHENTICODE_PFX_PASSWORD',
            'WINDOWS_AUTHENTICODE_THUMBPRINT_SHA1',
            'WINDOWS_AUTHENTICODE_TIMESTAMP_URL'
          )
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count -gt 0) { throw "Release signing is fail-closed; missing: $($missing -join ', ')" }
          if ($env:WINDOWS_AUTHENTICODE_THUMBPRINT_SHA1 -notmatch '^[a-fA-F0-9]{40}$') { throw 'WINDOWS_AUTHENTICODE_THUMBPRINT_SHA1 must be a SHA-1 thumbprint' }
          $signTool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -File -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signTool) { throw 'signtool.exe was not found in the Windows SDK' }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'prospero-release-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_AUTHENTICODE_PFX_BASE64))
            $artifacts = @(Get-ChildItem 'packages/windows-native/prebuilds/win32-*/prospero_windows_native.node')
            if ($artifacts.Count -ne 2) { throw "Expected exactly two Windows native artifacts, found $($artifacts.Count)" }
            $expectedThumbprint = $env:WINDOWS_AUTHENTICODE_THUMBPRINT_SHA1.ToUpperInvariant()
            $artifacts | ForEach-Object {
              & $signTool sign /fd SHA256 /f $certificatePath /p $env:WINDOWS_AUTHENTICODE_PFX_PASSWORD /tr $env:WINDOWS_AUTHENTICODE_TIMESTAMP_URL /td SHA256 $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($_.FullName)" }
              & $signTool verify /pa /v $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool verification failed for $($_.FullName)" }
              $signature = Get-AuthenticodeSignature -LiteralPath $_.FullName
              if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint.ToUpperInvariant() -ne $expectedThumbprint) {
                throw "Unexpected Authenticode signer for $($_.FullName)"
              }
            }
          } finally {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }
      - name: Emit signed SHA-256 manifests
        env:
          WINDOWS_AUTHENTICODE_THUMBPRINT_SHA1: ${{ secrets.WINDOWS_AUTHENTICODE_THUMBPRINT_SHA1 }}
        run: |
          node packages/windows-native/scripts/stage-prebuild.mjs --source packages/windows-native/prebuilds/win32-x64/prospero_windows_native.node --destination packages/windows-native --arch x64 --authenticode-status valid --thumbprint $env:WINDOWS_AUTHENTICODE_THUMBPRINT_SHA1
          node packages/windows-native/scripts/stage-prebuild.mjs --source packages/windows-native/prebuilds/win32-arm64/prospero_windows_native.node --destination packages/windows-native --arch arm64 --authenticode-status valid --thumbprint $env:WINDOWS_AUTHENTICODE_THUMBPRINT_SHA1
          npm run verify:prebuilds --workspace=@prospero/windows-native
      - name: Build daemon package and require it to embed both signed prebuilds
        env:
          PROSPERO_WINDOWS_NATIVE_PREBUILD_SOURCE: ${{ github.workspace }}/packages/windows-native
        run: |
          npm run build --workspace=@prospero/daemon
          npm run prepack --workspace=@prospero/daemon
          node packages/windows-native/scripts/verify-release-pack.mjs --native-root packages/windows-native --daemon-root apps/daemon --output-dir $env:RUNNER_TEMP/release-packages
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/release-packages/*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: windows-native-signed-x64
          path: packages/windows-native/prebuilds/win32-x64
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: windows-native-signed-arm64
          path: packages/windows-native/prebuilds/win32-arm64
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: prospero-release-packages
          path: ${{ runner.temp }}/release-packages
          if-no-files-found: error

  release-signed-load:
    name: Signed production loader (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-stage
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build --workspace=@prospero/windows-native
      - name: Assert signed smoke runner architecture
        run: |
          node -e "if (process.platform !== 'win32' || process.arch !== '${{ matrix.arch }}') { throw new Error('expected win32/${{ matrix.arch }}, received ' + process.platform + '/' + process.arch) }"
      - uses: actions/download-artifact@v5
        with:
          name: windows-native-signed-${{ matrix.arch }}
          path: packages/windows-native/prebuilds/win32-${{ matrix.arch }}
      - name: Load the signed artifact through the production loader
        run: node packages/windows-native/scripts/smoke-loader.mjs --package-root packages/windows-native --expect valid
      - name: Exercise signed full-process Session Host acceptance
        env:
          PROSPERO_WINDOWS_SIGNED_SESSION_HOST_TEST: "1"
        run: |
          npm run build --workspace=@prospero/daemon
          npm run test:windows-native --workspace=@prospero/daemon

  release-publish:
    name: Publish Windows native npm package with provenance
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-stage, release-signed-load]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v5
        with:
          name: prospero-release-packages
          path: release-packages
      - name: Require npm publish credentials and publish the attested native package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo 'NPM_TOKEN is required; refusing unsigned/unprovenanced release'; exit 1; }
          npm publish release-packages/prospero-windows-native-*.tgz --provenance

  swift:
    name: Swift build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - run: swift build --package-path apps/shell

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check -
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
      - name: Scan Git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --config .gitleaks.toml --log-opts="--all"'
