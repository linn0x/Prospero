<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Prospero Terminal</title>
<link rel="stylesheet" href="/assets/xterm.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #09090b; overflow: hidden; }
  #term { height: 100%; width: 100%; padding: 6px 2px 6px 8px; box-sizing: border-box; }
  .xterm .xterm-viewport { overflow-y: auto !important; -webkit-overflow-scrolling: touch; }
</style>
</head>
<body>
<div id="term"></div>
<script src="/assets/xterm.js"></script>
<script src="/assets/fit.js"></script>
<script src="/assets/webgl.js"></script>
<script>
  const post = (o) => window.ReactNativeWebView && window.ReactNativeWebView.postMessage(JSON.stringify(o));

  const term = new window.Terminal({
    scrollback: 3000,
    fontSize: 12,
    fontFamily: "Menlo, Monaco, monospace",
    lineHeight: 1.12,
    letterSpacing: 0.1,
    minimumContrastRatio: 4.5,
    theme: {
      background: "#09090b",
      foreground: "#d8d8df",
      cursor: "#9bb3ff",
      cursorAccent: "#09090b",
      selectionBackground: "#3956a866",
      black: "#202027",
      brightBlack: "#6c6c78",
      red: "#ef6a6a",
      brightRed: "#ff8585",
      green: "#69cc92",
      brightGreen: "#85dfa8",
      yellow: "#e6b35a",
      brightYellow: "#f3c872",
      blue: "#82a6ff",
      brightBlue: "#a3bcff",
      magenta: "#c38df3",
      brightMagenta: "#d9adff",
      cyan: "#62c6d7",
      brightCyan: "#86dce8",
      white: "#d8d8df",
      brightWhite: "#f4f4f7",
    },
    allowProposedApi: true,
    cursorBlink: true,
    cursorStyle: "bar",
    cursorInactiveStyle: "outline",
    scrollOnUserInput: true,
  });
  const fit = new window.FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById("term"));

  let renderer = "dom";
  try {
    const gl = new window.WebglAddon.WebglAddon();
    gl.onContextLoss(() => gl.dispose());
    term.loadAddon(gl);
    renderer = "webgl";
  } catch (e) {
    // WebGL 不可用则回退 DOM 渲染(spike 会记录)
  }

  const te = new TextEncoder();
  function bytesToB64(bytes) {
    let bin = "";
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }
  function b64ToBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  /**
   * 写快照期间屏蔽上行输入。
   *
   * xterm 会自动应答终端查询(DA / DSR 等)—— 这在正常输出流上是必须的,
   * Claude Code 那类 Ink 应用不回答就会挂住。但 attach 时重放快照,
   * 快照里若含查询序列,xterm 会【再答一次】,而那次应答会被当成用户
   * 敲的键送进 shell:实测表现是命令行上凭空多出 "1;2c",把命令打乱。
   * 重放产生的应答不是用户意图,丢掉。
   */
  let replaying = false;
  term.onData((d) => {
    if (replaying) return;
    post({ kind: "input", data: bytesToB64(te.encode(d)) });
  });

  // 首次尺寸必须等原生层发来受控字号后再计算。否则 ready 之后的默认 12px fit
  // 可能先触发 attach，随后 Dynamic Type 才改变列数，造成短暂错配。
  let fontReady = false;
  let fitTimer = null;
  function doFit() {
    if (!fontReady || fitTimer) return;
    fitTimer = setTimeout(() => {
      fitTimer = null;
      try { fit.fit(); } catch (e) {}
      post({ kind: "resized", cols: term.cols, rows: term.rows });
    }, 50);
  }

  // 性能打点(W4 spike):有输出流量的秒窗上报 fps 与吞吐
  let perfBytes = 0;
  let perfFrames = 0;
  let perfLast = performance.now();
  (function perfLoop() {
    requestAnimationFrame(() => {
      perfFrames++;
      const now = performance.now();
      if (now - perfLast >= 1000) {
        if (perfBytes > 0) {
          post({
            kind: "perf",
            fps: Math.round((perfFrames * 1000) / (now - perfLast)),
            kb: Math.round(perfBytes / 1024),
            renderer,
          });
        }
        perfFrames = 0;
        perfBytes = 0;
        perfLast = now;
      }
      perfLoop();
    });
  })();

  function handle(m) {
    if (m.kind === "snapshot") {
      replaying = true;
      term.reset();
      if (m.cols && m.rows && (m.cols !== term.cols || m.rows !== term.rows)) {
        term.resize(m.cols, m.rows);
      }
      // 回调里放开:xterm 的应答是异步发出的,同步清标志会漏掉
      term.write(m.ansi, () => { replaying = false; });
      perfBytes += m.ansi.length;
    } else if (m.kind === "output") {
      const bytes = b64ToBytes(m.dataB64);
      term.write(bytes);
      perfBytes += bytes.length;
    } else if (m.kind === "fit") {
      doFit();
    } else if (m.kind === "font") {
      term.options.fontSize = m.size;
      fontReady = true;
      doFit();
    } else if (m.kind === "focus") {
      term.focus();
    } else if (m.kind === "blur") {
      term.blur();
    } else if (m.kind === "scrollBottom") {
      term.scrollToBottom();
    }
  }

  /**
   * 入口:一次可以带多条消息(RN 侧把同一 tick 内到达的输出合并成一批)。
   * 每次跨桥都有固定开销,洪峰时逐条过桥是纯浪费。
   */
  function receive(payload) {
    const batch = JSON.parse(payload);
    for (let i = 0; i < batch.length; i++) handle(batch[i]);
  }

  // 走 postMessage 而不是 injectJavaScript:后者要把数据 JSON 序列化两遍、
  // 拼成一段 JS 源码、再由引擎 eval —— 输出流上这是每块都付一次的冤枉钱。
  window.addEventListener("message", (e) => receive(e.data));
  document.addEventListener("message", (e) => receive(e.data));
  // 保留旧入口:RN 侧首帧仍可能用 injectJavaScript 兜底
  window.__rx = (jsonStr) => handle(JSON.parse(jsonStr));

  new ResizeObserver(() => doFit()).observe(document.body);
  // 点终端取得焦点唤起键盘。
  //
  // 必须区分"点"和"划":早先版本对任何 touchend 都 focus(),结果是收起键盘后
  // 一滚动就又被拉回来 —— 根本关不掉。只有位移很小、时长很短的才算点击。
  /**
   * 捏合缩放字号,吸附到预设档位。
   *
   * 吸附是刻意的:自由缩放会停在 11.3px 这种值上,等宽字体在非整数字号下
   * 渲染发虚,而手机上本来就看得吃力。档位之间跳,每一档都清晰。
   */
  (function pinchZoom() {
    const STEPS = [8, 9, 10, 11, 12, 14, 16, 18, 20];
    const el = document.getElementById("term");
    let base = 0, startSize = 12;
    const dist = (t) => Math.hypot(
      t[0].clientX - t[1].clientX,
      t[0].clientY - t[1].clientY,
    );
    el.addEventListener("touchstart", (e) => {
      if (e.touches.length !== 2) return;
      base = dist(e.touches);
      startSize = term.options.fontSize;
    }, { passive: true });
    el.addEventListener("touchmove", (e) => {
      if (e.touches.length !== 2 || base === 0) return;
      const target = startSize * (dist(e.touches) / base);
      let best = STEPS[0];
      for (const s of STEPS) {
        if (Math.abs(s - target) < Math.abs(best - target)) best = s;
      }
      if (best !== term.options.fontSize) {
        term.options.fontSize = best;
        doFit();
        post({ kind: "fontSize", size: best });
      }
    }, { passive: true });
    el.addEventListener("touchend", (e) => {
      if (e.touches.length < 2) base = 0;
    }, { passive: true });
  })();

  (function tapToFocus() {
    const el = document.getElementById("term");
    let sx = 0, sy = 0, st = 0, moved = false;
    el.addEventListener("touchstart", (e) => {
      const t = e.touches[0];
      if (!t) return;
      sx = t.clientX; sy = t.clientY; st = Date.now(); moved = false;
    }, { passive: true });
    el.addEventListener("touchmove", (e) => {
      const t = e.touches[0];
      if (!t) return;
      if (Math.abs(t.clientX - sx) > 10 || Math.abs(t.clientY - sy) > 10) moved = true;
    }, { passive: true });
    el.addEventListener("touchend", () => {
      if (!moved && Date.now() - st < 500) term.focus();
    }, { passive: true });
  })();
  window.addEventListener("load", () => {
    post({ kind: "ready", renderer });
  });
</script>
</body>
</html>
