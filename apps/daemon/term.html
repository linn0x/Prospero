<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Prospero Terminal</title>
<link rel="stylesheet" href="/assets/xterm.css" />
<style>
  :root {
    color-scheme: dark;
    --term-bg: #1a1b26;
    --term-surface: #1f2130;
    --term-blue: #7aa2f7;
    --term-cyan: #7dcfff;
    --term-fg: #c0caf5;
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--term-bg);
    overflow: hidden;
  }
  body { position: relative; }
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    box-shadow:
      inset 0 1px rgba(125, 207, 255, 0.06),
      inset 12px 0 28px -24px rgba(122, 162, 247, 0.4);
  }
  /*
   * 终端贴底:键盘弹出/收起、折叠屏展开时容器高度逐帧变化，而行数要等尺寸
   * 稳定后才重算。底部对齐让提示符一路贴着键盘上沿走，多出/不够的高度落在
   * 顶部(历史区),不会出现提示符被裁掉、再整屏跳一下的情况。
   */
  #term {
    height: 100%;
    width: 100%;
    padding: 8px 3px 8px 10px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  #term > .xterm { flex: none; }
  .xterm .xterm-viewport {
    overflow-y: auto !important;
    -webkit-overflow-scrolling: touch;
    scrollbar-color: rgba(122, 162, 247, 0.34) transparent;
  }
  .xterm .xterm-viewport::-webkit-scrollbar { width: 9px; }
  .xterm .xterm-viewport::-webkit-scrollbar-track { background: transparent; }
  .xterm .xterm-viewport::-webkit-scrollbar-thumb {
    background: rgba(122, 162, 247, 0.25);
    border: 3px solid var(--term-bg);
    border-radius: 999px;
  }
  .xterm .xterm-viewport::-webkit-scrollbar-thumb:hover {
    background: rgba(125, 207, 255, 0.48);
  }
  #terminal-toast {
    position: absolute;
    right: 14px;
    bottom: 13px;
    z-index: 8;
    max-width: min(320px, calc(100vw - 28px));
    padding: 6px 10px;
    border: 1px solid rgba(122, 162, 247, 0.28);
    border-radius: 7px;
    background: rgba(31, 33, 48, 0.94);
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
    color: var(--term-fg);
    font: 11px ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    opacity: 0;
    transform: translateY(5px) scale(0.98);
    transition: opacity 120ms ease, transform 120ms ease;
    pointer-events: none;
  }
  #terminal-toast.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  body.visual-bell::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 7;
    pointer-events: none;
    border: 1px solid rgba(125, 207, 255, 0.72);
    box-shadow: inset 0 0 26px rgba(122, 162, 247, 0.16);
    animation: terminal-bell 150ms ease-out;
  }
  @keyframes terminal-bell { from { opacity: 1; } to { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    #terminal-toast { transition: none; }
    body.visual-bell::after { animation: none; opacity: 0; }
  }
</style>
</head>
<body>
<div id="term"></div>
<div id="terminal-toast" role="status" aria-live="polite"></div>
<script src="/assets/xterm.js"></script>
<script src="/assets/fit.js"></script>
<script src="/assets/webgl.js"></script>
<script>
  const post = (o) => window.ReactNativeWebView && window.ReactNativeWebView.postMessage(JSON.stringify(o));
  const DEFAULT_FONT_FAMILY = "Cascadia Mono, Consolas, ui-monospace, SFMono-Regular, Menlo, Monaco, monospace";

  function quotedCSSFontFamily(name) {
    const clean = String(name || "")
      .replace(/[\u0000-\u001f\u007f]/g, " ")
      .replace(/\\/g, "\\\\")
      .replace(/"/g, "\\\"");
    return `"${clean}"`;
  }

  function fontStack(family) {
    const preferred = typeof family === "string" ? family.trim() : "";
    return preferred
      ? `${quotedCSSFontFamily(preferred)}, ${DEFAULT_FONT_FAMILY}`
      : DEFAULT_FONT_FAMILY;
  }

  const term = new window.Terminal({
    scrollback: 3000,
    fontSize: 12,
    fontFamily: DEFAULT_FONT_FAMILY,
    fontWeight: "400",
    fontWeightBold: "600",
    lineHeight: 1.16,
    letterSpacing: 0.1,
    minimumContrastRatio: 4.5,
    // Tokyo Night —— 与 iTerm2 默认 profile 的深色配色逐值一致,
    // 让 Mac 壳里的 tmux 终端和用户平时的 iTerm 看起来是同一个终端。
    theme: {
      background: "#1a1b26",
      foreground: "#c0caf5",
      cursor: "#c0caf5",
      cursorAccent: "#1a1b26",
      selectionBackground: "#283457",
      selectionInactiveBackground: "#242b49",
      scrollbarSliderBackground: "#7aa2f733",
      scrollbarSliderHoverBackground: "#7dcfff66",
      scrollbarSliderActiveBackground: "#7dcfff88",
      black: "#15161e",
      brightBlack: "#414868",
      red: "#f7768e",
      brightRed: "#f7768e",
      green: "#9ece6a",
      brightGreen: "#9ece6a",
      yellow: "#e0af68",
      brightYellow: "#e0af68",
      blue: "#7aa2f7",
      brightBlue: "#7aa2f7",
      magenta: "#bb9af7",
      brightMagenta: "#bb9af7",
      cyan: "#7dcfff",
      brightCyan: "#7dcfff",
      white: "#a9b1d6",
      brightWhite: "#c0caf5",
    },
    allowProposedApi: true,
    cursorBlink: true,
    cursorStyle: "bar",
    cursorWidth: 2,
    cursorInactiveStyle: "outline",
    customGlyphs: true,
    drawBoldTextInBrightColors: true,
    rescaleOverlappingGlyphs: true,
    smoothScrollDuration: 40,
    fastScrollSensitivity: 5,
    macOptionIsMeta: true,
    macOptionClickForcesSelection: true,
    altClickMovesCursor: false,
    rightClickSelectsWord: true,
    scrollOnUserInput: true,
  });
  const fit = new window.FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById("term"));
  const search = window.SearchAddon ? new window.SearchAddon.SearchAddon() : null;
  if (search) term.loadAddon(search);

  let renderer = "dom";
  function repaint() {
    try { term.refresh(0, term.rows - 1); } catch (e) {}
  }
  try {
    const gl = new window.WebglAddon.WebglAddon();
    // 折叠屏展开/合上会把 Activity 挪到另一块显示器,GPU 上下文可能随之丢失。
    // dispose 只是把渲染器换回 DOM,并不会重画 —— 不补 refresh 就停在半张
    // 旧画面上,直到下一次输出才恢复。
    gl.onContextLoss(() => {
      gl.dispose();
      renderer = "dom";
      repaint();
    });
    term.loadAddon(gl);
    renderer = "webgl";
  } catch (e) {
    // WebGL 不可用则回退 DOM 渲染(spike 会记录)
  }

  const te = new TextEncoder();
  const td = new TextDecoder();
  function bytesToB64(bytes) {
    let bin = "";
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }
  function b64ToBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  let toastTimer = null;
  function showToast(message) {
    const toast = document.getElementById("terminal-toast");
    if (!toast || !message) return;
    toast.textContent = message;
    toast.classList.add("visible");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("visible"), 1250);
  }

  function sendInputText(text) {
    if (replaying || !text) return;
    post({ kind: "input", data: bytesToB64(te.encode(text)) });
  }

  // Keep macOS editing muscle memory while sending the actual zsh control
  // sequences through the PTY. Ctrl shortcuts remain untouched for TUIs.
  term.attachCustomKeyEventHandler((event) => {
    if (event.type !== "keydown") return true;
    const key = event.key.toLowerCase();
    const windowsHost = /Win/i.test(navigator.platform || navigator.userAgent || "");
    // Match Windows Terminal muscle memory without stealing Ctrl+C from shells
    // and TUIs. Copy requires an active selection; otherwise Ctrl+C continues
    // through xterm as the PTY interrupt byte. Ctrl+Shift+C/V always act as
    // clipboard shortcuts.
    if (windowsHost && event.ctrlKey && !event.metaKey && !event.altKey) {
      if (key === "c" && (event.shiftKey || term.hasSelection())) {
        if (term.hasSelection()) post({ kind: "clipboardCopy", text: term.getSelection() });
        else showToast("先选择终端内容");
        return false;
      }
      if (key === "v" && event.shiftKey) {
        post({ kind: "clipboardPaste" });
        return false;
      }
    }
    if (event.metaKey && !event.ctrlKey && !event.altKey) {
      if (key === "c") {
        if (term.hasSelection()) {
          post({ kind: "clipboardCopy", text: term.getSelection() });
        } else {
          showToast("按住 ⌥ 拖动选择文本");
        }
        return false;
      }
      if (key === "v") {
        post({ kind: "clipboardPaste" });
        return false;
      }
      if (key === "a") {
        term.selectAll();
        showToast("已选择终端内容");
        return false;
      }
      if (key === "k") {
        term.clear();
        sendInputText("\x0c");
        showToast("已清屏");
        return false;
      }
      if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
        sendInputText("\x01"); // zsh beginning-of-line
        return false;
      }
      if (event.key === "ArrowRight" || event.key === "ArrowDown") {
        sendInputText("\x05"); // zsh end-of-line
        return false;
      }
      if (event.key === "Backspace") {
        sendInputText("\x15"); // zsh backward-kill-line
        return false;
      }
      if (event.key === "Delete") {
        sendInputText("\x0b"); // zsh kill-line
        return false;
      }
    }
    if (event.altKey && !event.metaKey && !event.ctrlKey) {
      if (event.key === "ArrowLeft") {
        sendInputText("\x1bb"); // zsh backward-word
        return false;
      }
      if (event.key === "ArrowRight") {
        sendInputText("\x1bf"); // zsh forward-word
        return false;
      }
    }
    if (event.shiftKey && event.key === "Insert") {
      post({ kind: "clipboardPaste" });
      return false;
    }
    return true;
  });

  // tmux copy-mode and modern CLIs use OSC 52 for the host clipboard. xterm
  // intentionally leaves the OS integration to its embedder, so bridge writes
  // to AppKit but never answer clipboard-read queries from terminal programs.
  term.parser.registerOscHandler(52, (data) => {
    if (replaying) return true;
    const separator = data.indexOf(";");
    if (separator < 0) return false;
    const payload = data.slice(separator + 1);
    if (payload === "?" || payload.length > 8 * 1024 * 1024) return true;
    try {
      post({ kind: "clipboardCopy", text: td.decode(b64ToBytes(payload)) });
    } catch (_) {
      showToast("无法读取终端剪贴板内容");
    }
    return true;
  });

  term.onBell(() => {
    document.body.classList.remove("visual-bell");
    // Force a style flush so repeated bells restart the short pulse.
    void document.body.offsetWidth;
    document.body.classList.add("visual-bell");
    setTimeout(() => document.body.classList.remove("visual-bell"), 170);
  });

  /**
   * 写快照期间屏蔽上行输入。
   *
   * xterm 会自动应答终端查询(DA / DSR 等)—— 这在正常输出流上是必须的,
   * Claude Code 那类 Ink 应用不回答就会挂住。但 attach 时重放快照,
   * 快照里若含查询序列,xterm 会【再答一次】,而那次应答会被当成用户
   * 敲的键送进 shell:实测表现是命令行上凭空多出 "1;2c",把命令打乱。
   * 重放产生的应答不是用户意图,丢掉。
   */
  let replaying = false;
  let capturedPaste = null;
  term.onData((d) => {
    if (replaying) return;
    if (capturedPaste !== null) { capturedPaste += d; return; }
    post({ kind: "input", data: bytesToB64(te.encode(d)) });
  });

  // 首次尺寸必须等原生层发来受控字号后再计算。否则 ready 之后的默认 12px fit
  // 可能先触发 attach，随后 Dynamic Type 才改变列数，造成短暂错配。
  let fontReady = false;
  let fontRevision = 0;
  let currentFontFamily = "";
  let fitTimer = null;
  // 快照/回放会把终端改成服务端记录的行列;那可能是本端 resize 生效前的旧值
  // (例如折叠屏换到外屏后重连)。写完后若与容器能放下的不一致，就重新 fit
  // 并把正确尺寸报回去。只在快照/回放后做，不跟实时流里其他端的 resize 抢。
  function refitIfDrifted() {
    if (!fontReady || typeof fit.proposeDimensions !== "function") return;
    let proposed = null;
    try { proposed = fit.proposeDimensions(); } catch (e) {}
    if (proposed && (proposed.cols !== term.cols || proposed.rows !== term.rows)) doFit();
  }

  // 尾随防抖：动画期间 ResizeObserver 每帧都会触发，过去每 50ms fit 一次，
  // 等于在动画中途反复改 PTY 尺寸、逼 shell/TUI 重绘好几遍。现在只在尺寸
  // 停止变化后 fit 一次;中间帧靠上面的贴底布局保持画面连贯。
  function doFit(delay = 80) {
    if (!fontReady) return;
    if (fitTimer) clearTimeout(fitTimer);
    fitTimer = setTimeout(() => {
      fitTimer = null;
      if (!fontReady) return;
      try { fit.fit(); } catch (e) {}
      // 尺寸跳变(折叠屏展开)后 fit 若算出相同的行列,xterm 不会重画,
      // 新露出的区域就一直是空的。
      try { term.refresh(0, term.rows - 1); } catch (e) {}
      post({ kind: "resized", cols: term.cols, rows: term.rows });
    }, delay);
  }

  // 性能打点(W4 spike):有输出流量的秒窗上报 fps 与吞吐
  let perfBytes = 0;
  let perfFrames = 0;
  let perfLast = performance.now();
  // Older desktop/Swift bridges keep their existing behavior until they send activity.
  let perfActive = true;
  let perfEnabled = true;
  let perfFrame = null;
  function perfLoop() {
    if (!perfActive || !perfEnabled || perfFrame !== null) return;
    perfFrame = requestAnimationFrame(() => {
      perfFrame = null;
      perfFrames++;
      const now = performance.now();
      if (now - perfLast >= 1000) {
        if (perfBytes > 0) {
          post({
            kind: "perf",
            fps: Math.round((perfFrames * 1000) / (now - perfLast)),
            kb: Math.round(perfBytes / 1024),
            renderer,
          });
        }
        perfFrames = 0;
        perfBytes = 0;
        perfLast = now;
      }
      perfLoop();
    });
  }
  perfLoop();

  let terminalQueue = [];
  let terminalWriting = false;
  function flushTerminalQueue() {
    if (terminalWriting) return;
    while (terminalQueue.length) {
      const action = terminalQueue.shift();
      if (action.kind === "reset") { replaying = true; term.reset(); term.resize(action.cols, action.rows); continue; }
      if (action.type === "resize") { term.resize(action.size.cols, action.size.rows); continue; }
      if (action.kind === "encodePaste") {
        capturedPaste = "";
        try {
          if (typeof action.text === "string" && action.text.length > 0) term.paste(action.text);
          post({ kind: "pasteInput", requestId: action.requestId, data: bytesToB64(te.encode(capturedPaste)) });
        } finally { capturedPaste = null; }
        continue;
      }
      const bytes = action.text !== undefined ? action.text : b64ToBytes(action.dataB64);
      terminalWriting = true;
      if (action.replay) replaying = true;
      perfBytes += bytes.length;
      term.write(bytes, () => {
        terminalWriting = false;
        if (action.snapshot || action.replay) { replaying = false; refitIfDrifted(); }
        flushTerminalQueue();
      });
      return;
    }
  }

  function handle(m) {
    if (m.kind === "activity") {
      perfActive = m.active !== false;
      perfEnabled = m.metrics !== false;
      if (perfFrame !== null) cancelAnimationFrame(perfFrame);
      perfFrame = null;
      perfFrames = 0;
      perfBytes = 0;
      perfLast = performance.now();
      perfLoop();
    } else if (m.kind === "snapshot") {
      terminalQueue = [{ kind: "reset", cols: m.cols || term.cols, rows: m.rows || term.rows },
        typeof m.dataB64 === "string" ? { dataB64: m.dataB64, snapshot: true } : { text: m.ansi, snapshot: true }];
      flushTerminalQueue();
    } else if (m.kind === "output") {
      terminalQueue.push({ dataB64: m.dataB64 });
      flushTerminalQueue();
    } else if (m.kind === "events") {
      terminalQueue.push(...m.events.map(event => ({ ...event, replay: m.replay === true })));
      flushTerminalQueue();
    } else if (m.kind === "fit") {
      doFit();
    } else if (m.kind === "font") {
      const requestedSize = Number(m.size);
      const size = Number.isFinite(requestedSize)
        ? Math.min(72, Math.max(6, requestedSize))
        : 12;
      const family = typeof m.family === "string" ? m.family.trim() : "";
      if (fontReady && size === term.options.fontSize && family === currentFontFamily) return;
      currentFontFamily = family;
      term.options.fontFamily = fontStack(family);
      term.options.fontSize = size;
      fontReady = false;
      const revision = ++fontRevision;
      const fitted = () => {
        if (revision !== fontRevision) return;
        fontReady = true;
        doFit();
      };
      // 本机字体通常立即可用；仍等 FontFaceSet 确认一次再 fit，避免先按
      // fallback 的字宽算列数，下一帧换成 Nerd Font 后文字与 tmux 网格错位。
      if (family && document.fonts && document.fonts.load) {
        document.fonts.load(`${size}px ${quotedCSSFontFamily(family)}`).then(fitted, fitted);
      } else {
        fitted();
      }
    } else if (m.kind === "focus") {
      term.focus();
    } else if (m.kind === "blur") {
      term.blur();
    } else if (m.kind === "scrollBottom") {
      term.scrollToBottom();
    } else if (m.kind === "paste") {
      if (typeof m.text === "string" && m.text.length > 0) term.paste(m.text);
    } else if (m.kind === "encodePaste") {
      // Process after preceding output, which may change bracketed-paste mode.
      terminalQueue.push(m);
      flushTerminalQueue();
    } else if (m.kind === "selectAll") {
      term.selectAll();
    } else if (m.kind === "copyAll") {
      term.selectAll();
      const text = term.getSelection();
      term.clearSelection();
      if (text) post({ kind: "clipboardCopy", text });
    } else if (m.kind === "search") {
      if (search && typeof m.text === "string") {
        if (!m.text) search.clearDecorations();
        else if (m.previous) search.findPrevious(m.text);
        else search.findNext(m.text, { incremental: m.incremental === true });
      }
    } else if (m.kind === "clear") {
      term.clear();
    } else if (m.kind === "toast") {
      showToast(m.text);
    }
  }

  /**
   * 入口:一次可以带多条消息(RN 侧把同一 tick 内到达的输出合并成一批)。
   * 每次跨桥都有固定开销,洪峰时逐条过桥是纯浪费。
   */
  function receive(payload) {
    const batch = JSON.parse(payload);
    for (let i = 0; i < batch.length; i++) handle(batch[i]);
  }

  // 走 postMessage 而不是 injectJavaScript:后者要把数据 JSON 序列化两遍、
  // 拼成一段 JS 源码、再由引擎 eval —— 输出流上这是每块都付一次的冤枉钱。
  window.addEventListener("message", (e) => receive(e.data));
  document.addEventListener("message", (e) => receive(e.data));
  // 保留旧入口:RN 侧首帧仍可能用 injectJavaScript 兜底。
  // Mac 壳的 WKWebView 没有 postMessage 通路,只能走 evaluateJavaScript,
  // 所以这里也接受数组 —— 让它能和 receive 一样一次过桥送完一批。
  window.__rx = (jsonStr) => {
    const m = JSON.parse(jsonStr);
    if (Array.isArray(m)) { for (let i = 0; i < m.length; i++) handle(m[i]); }
    else handle(m);
  };

  new ResizeObserver(() => doFit()).observe(document.body);
  // 点终端取得焦点唤起键盘。
  //
  // 必须区分"点"和"划":早先版本对任何 touchend 都 focus(),结果是收起键盘后
  // 一滚动就又被拉回来 —— 根本关不掉。只有位移很小、时长很短的才算点击。
  /**
   * 捏合缩放字号,吸附到预设档位。
   *
   * 吸附是刻意的:自由缩放会停在 11.3px 这种值上,等宽字体在非整数字号下
   * 渲染发虚,而手机上本来就看得吃力。档位之间跳,每一档都清晰。
   */
  // 双指缩放进行中时滚动让路;由 pinchZoom 写、touchScroll 读。
  let pinchActive = false;
  (function pinchZoom() {
    const STEPS = [8, 9, 10, 11, 12, 14, 16, 18, 20];
    const el = document.getElementById("term");
    let base = 0, startSize = 12, starts = null, pendingSize = null, activeSteps = STEPS;
    const dist = (t) => Math.hypot(
      t[0].clientX - t[1].clientX,
      t[0].clientY - t[1].clientY,
    );
    const mid = (t) => ({
      x: (t[0].clientX + t[1].clientX) / 2,
      y: (t[0].clientY + t[1].clientY) / 2,
    });
    const previewTarget = () => term.element || el.firstElementChild;
    const clearPreview = () => {
      const target = previewTarget();
      if (!target) return;
      target.style.transform = "";
      target.style.transformOrigin = "";
      target.style.willChange = "";
      target.style.backfaceVisibility = "";
    };
    const setPreview = (scale, point) => {
      const target = previewTarget();
      if (!target) return;
      const rect = target.getBoundingClientRect();
      target.style.transformOrigin = `${point.x - rect.left}px ${point.y - rect.top}px`;
      target.style.transform = `scale(${scale}) translateZ(0)`;
      target.style.willChange = "transform";
      target.style.backfaceVisibility = "hidden";
    };
    el.addEventListener("touchstart", (e) => {
      if (e.touches.length !== 2) return;
      base = dist(e.touches);
      startSize = term.options.fontSize;
      activeSteps = STEPS.includes(startSize) ? STEPS : [...STEPS, startSize].sort((a, b) => a - b);
      pendingSize = null;
      starts = [...e.touches].map((t) => ({ id: t.identifier, x: t.clientX, y: t.clientY }));
      pinchActive = false;
    }, { passive: true });
    el.addEventListener("touchmove", (e) => {
      if (e.touches.length !== 2 || base === 0 || !starts) return;
      const ratio = dist(e.touches) / base;
      if (!pinchActive) {
        // 横屏握持时拇指常搭在屏幕边上，另一指滑动也会改变两点距离。
        // 只有两指都动起来、且距离变化明显，才认作捏合。
        const bothMoved = [...e.touches].every((t) => {
          const s0 = starts.find((s) => s.id === t.identifier);
          return s0 && Math.hypot(t.clientX - s0.x, t.clientY - s0.y) > 12;
        });
        if (!bothMoved || Math.abs(ratio - 1) < 0.12) return;
        pinchActive = true;
      }
      e.preventDefault();
      const target = startSize * ratio;
      let best = activeSteps[0];
      for (const s of activeSteps) {
        if (Math.abs(s - target) < Math.abs(best - target)) best = s;
      }
      const minScale = activeSteps[0] / startSize;
      const maxScale = activeSteps[activeSteps.length - 1] / startSize;
      setPreview(Math.min(maxScale, Math.max(minScale, ratio)), mid(e.touches));
      pendingSize = best !== startSize ? best : null;
    }, { passive: false });
    const end = (e) => {
      if (e.touches.length < 2) {
        const committedSize = pendingSize;
        clearPreview();
        if (committedSize !== null && committedSize !== term.options.fontSize) {
          term.options.fontSize = committedSize;
          doFit(0);
          post({ kind: "fontSize", size: committedSize });
        }
        base = 0; starts = null; pendingSize = null; pinchActive = false;
      }
    };
    el.addEventListener("touchend", end, { passive: true });
    el.addEventListener("touchcancel", end, { passive: true });
  })();

  /**
   * 单指上下拖动滚动终端。
   *
   * xterm 6 换成了 VS Code 的滚动容器,只认 wheel,不再处理触摸,手机上划不动。
   * 这里把位移按行高折算:普通缓冲区直接 scrollLines;应用开了鼠标追踪
   * (全屏 TUI)就合成 wheel 事件交给 xterm,由它按当前协议编码成滚轮上报。
   * 备用缓冲区且没开鼠标时什么都不发 —— xterm 会把滚轮变成方向键,
   * 一次误划就会翻 Agent 的输入历史。
   */
  (function touchScroll() {
    const el = document.getElementById("term");
    let lastY = 0, lastT = 0, acc = 0, velocity = 0;
    let dragging = false, inertia = null;
    const cellHeight = () => {
      const screen = term.element && term.element.querySelector(".xterm-screen");
      const h = screen ? screen.getBoundingClientRect().height / term.rows : 0;
      return h > 0 ? h : 16;
    };
    const stopInertia = () => {
      if (inertia !== null) cancelAnimationFrame(inertia);
      inertia = null;
    };
    function scrollLines(lines, x, y) {
      if (lines === 0) return;
      if (term.modes.mouseTrackingMode !== "none") {
        const target = term.element.querySelector(".xterm-screen") || term.element;
        const step = lines > 0 ? 1 : -1;
        const count = Math.min(8, Math.abs(lines));
        for (let i = 0; i < count; i++) {
          target.dispatchEvent(new WheelEvent("wheel", {
            bubbles: true, cancelable: true, clientX: x, clientY: y,
            deltaY: step, deltaMode: WheelEvent.DOM_DELTA_LINE,
          }));
        }
      } else if (term.buffer.active.type === "normal") {
        const targetLine = Math.max(0, Math.min(term.buffer.active.baseY, term.buffer.active.viewportY + lines));
        term.scrollToLine(targetLine);
      }
    }
    // 手指上移 = 内容往新的方向走 = 正向行数
    function consume(dy, x, y) {
      acc -= dy;
      const h = cellHeight();
      const lines = acc > 0 ? Math.floor(acc / h) : Math.ceil(acc / h);
      if (lines !== 0) {
        acc -= lines * h;
        scrollLines(lines, x, y);
      }
    }
    // 按触点跟踪：屏幕上搭着一根不动的手指(横屏握持的拇指)时，另一根手指
    // 照样能滚。谁先在竖直方向上动起来就跟谁。
    const starts = new Map();
    let trackId = null;
    el.addEventListener("touchstart", (e) => {
      stopInertia();
      for (const t of e.changedTouches) starts.set(t.identifier, { x: t.clientX, y: t.clientY });
      if (!dragging) { acc = 0; velocity = 0; }
    }, { passive: true });
    el.addEventListener("touchmove", (e) => {
      if (pinchActive) { dragging = false; trackId = null; return; }
      if (!dragging) {
        for (const t of e.touches) {
          const s0 = starts.get(t.identifier);
          if (!s0) continue;
          const dx = Math.abs(t.clientX - s0.x), dy = Math.abs(t.clientY - s0.y);
          if (dy > 10 && dy >= dx) {
            dragging = true;
            trackId = t.identifier;
            lastY = t.clientY; lastT = performance.now();
            break;
          }
        }
        if (!dragging) return;
      }
      const t = [...e.touches].find((x) => x.identifier === trackId);
      if (!t) return;
      e.preventDefault();
      const now = performance.now();
      const dy = t.clientY - lastY;
      const dt = Math.max(1, now - lastT);
      velocity = 0.8 * (dy / dt) + 0.2 * velocity;
      lastY = t.clientY; lastT = now;
      consume(dy, t.clientX, t.clientY);
    }, { passive: false });
    el.addEventListener("touchend", (e) => {
      let ended = null;
      for (const t of e.changedTouches) {
        starts.delete(t.identifier);
        if (t.identifier === trackId) ended = t;
      }
      if (!dragging || !ended) return;
      dragging = false; trackId = null;
      const x = ended.clientX, y = ended.clientY;
      // 停顿后再抬手不算甩动
      if (performance.now() - lastT > 80 || Math.abs(velocity) < 0.3) return;
      let prev = performance.now();
      const step = (now) => {
        const dt = Math.min(32, now - prev);
        prev = now;
        velocity *= Math.pow(0.995, dt);
        if (Math.abs(velocity) < 0.05) { inertia = null; return; }
        consume(velocity * dt, x, y);
        inertia = requestAnimationFrame(step);
      };
      inertia = requestAnimationFrame(step);
    }, { passive: true });
    el.addEventListener("touchcancel", (e) => {
      for (const t of e.changedTouches) starts.delete(t.identifier);
      dragging = false; trackId = null;
    }, { passive: true });
  })();

  (function tapToFocus() {
    const el = document.getElementById("term");
    let sx = 0, sy = 0, st = 0, moved = false;
    el.addEventListener("touchstart", (e) => {
      const t = e.touches[0];
      if (!t) return;
      sx = t.clientX; sy = t.clientY; st = Date.now(); moved = false;
    }, { passive: true });
    el.addEventListener("touchmove", (e) => {
      const t = e.touches[0];
      if (!t) return;
      if (Math.abs(t.clientX - sx) > 10 || Math.abs(t.clientY - sy) > 10) moved = true;
    }, { passive: true });
    el.addEventListener("touchend", () => {
      if (!moved && Date.now() - st < 500) term.focus();
    }, { passive: true });
  })();
  window.addEventListener("load", () => {
    post({ kind: "ready", renderer });
  });
</script>
</body>
</html>
