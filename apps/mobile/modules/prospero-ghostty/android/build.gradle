plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.linn0x.prospero'
version = '0.1.0'

android {
  namespace 'com.linn0x.prospero.ghostty'
  ndkVersion rootProject.ext.ndkVersion

  defaultConfig {
    versionCode 1
    versionName '0.1.0'

    ndk {
      abiFilters 'arm64-v8a'
    }

    externalNativeBuild {
      cmake {
        cppFlags '-std=c++17'
      }
    }
  }

  externalNativeBuild {
    cmake {
      path 'src/main/cpp/CMakeLists.txt'
    }
  }
}
