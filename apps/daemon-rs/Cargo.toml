[package]
name = "prosperod-rs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
avt = "0.18.0"
axum = { version = "0.8.8", features = ["json", "query", "tokio", "http1"] }
base64 = "0.22.1"
clap = { version = "4.5.58", features = ["derive"] }
fs2 = "0.4.3"
futures-util = "0.3.32"
libc = "0.2"
portable-pty = "0.9.0"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
subtle = "2.6.1"
thiserror = "2.0"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
ts-rs = { version = "12.0.1", features = ["serde-compat", "serde-json-impl"] }
uuid = { version = "1.20.0", features = ["v4", "serde"] }
unicode-width = "0.1.14"

[dev-dependencies]
tempfile = "3.24.0"
tower = { version = "0.5.3", features = ["util"] }
